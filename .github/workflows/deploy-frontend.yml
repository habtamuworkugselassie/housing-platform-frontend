name: Build and Deploy Frontend

on:
  push:
    branches:
      - main

env:
  # Image lives in GitHub Container Registry, authenticated with the workflow's own
  # GITHUB_TOKEN. There is no personal access token to expire — the expired Docker Hub
  # PAT blocked every backend deploy between 2026-04-25 and 2026-08-26; this repo's last
  # green run (56, 23 July) was the last one before it would have bitten here too.
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  # Image name the droplet's ~/housing-platform/docker-compose.yml already references.
  # The image pulled from GHCR is retagged to this name on the server, so the compose
  # file (which is not in this repo) needs no change.
  DEPLOY_IMAGE: habtamuwgs/housing-platform-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # The image namespace comes from REGISTRY_IMAGE (github.repository), not from this
          # field — GHCR authorizes on the token, so username is only an identity label.
          # Use repository_owner rather than github.actor so it always matches that namespace
          # even when a collaborator or a bot is the one who pushed.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set repo secret BACKEND_URL to your droplet backend API (e.g. https://your-api.com/api/v1) so login/API calls use it instead of Render
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.BACKEND_URL }}

  # Split from `build` so the credential handed to the droplet is read-only: job-level
  # permissions scope GITHUB_TOKEN, and this job never needs to push.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    # GitHub repo secrets (Settings → Secrets and variables → Actions):
    #   DO_HOST, DO_SSH_USER, DO_SSH_KEY — droplet access
    #   BACKEND_URL — backend API base baked into the bundle at build time
    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are no longer used and can be deleted.
    steps:
      - name: Deploy on DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Short-lived, repo-scoped, read-only. Expires when this job ends.
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          DEPLOY_IMAGE: ${{ env.DEPLOY_IMAGE }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,REGISTRY_IMAGE,DEPLOY_IMAGE,SHA
          script: |
            set -euo pipefail
            cd ~/housing-platform

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            # Preserve the image currently serving traffic before promoting the new one.
            docker tag "$DEPLOY_IMAGE:latest" "$DEPLOY_IMAGE:rollback-$SHA" 2>/dev/null || true

            docker pull "$REGISTRY_IMAGE:$SHA"
            docker tag "$REGISTRY_IMAGE:$SHA" "$DEPLOY_IMAGE:latest"

            docker compose up -d
            docker image prune -f
