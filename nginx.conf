# www -> apex, permanently. Both hosts used to answer 200 with no redirect, so each
# was a complete separate copy of the site competing with the other; the canonical
# now names the apex either way, but a redirect is the unambiguous signal. Its own
# server block, matched by server_name, rather than an `if` in the main one. No loop
# risk: the target host differs from the one being matched.
server {
    listen 80;
    server_name www.ethiobuildconnect.et;
    return 301 https://ethiobuildconnect.et$request_uri;
}

server {
    listen 80;
    server_name localhost ethiobuildconnect.et;
    root /usr/share/nginx/html;
    index index.html;
    sendfile on;
    tcp_nopush on;
    etag on;

    # Serve uploaded media from disk (same path as backend UPLOAD_DIR). Skips Spring for GETs.
    # Mount the host uploads dir read-only into this container, e.g.:
    #   /var/lib/housing-platform/uploads:/var/lib/housing-platform/uploads:ro
    # URL /api/v1/uploads/properties/... maps to .../properties/... under that directory.
    location ^~ /api/v1/uploads/ {
        alias /var/lib/housing-platform/uploads/;
        add_header Accept-Ranges bytes;
        # Upload filenames are UUID-based and immutable; cache aggressively.
        add_header Cache-Control "public, max-age=2592000, immutable";
        expires 30d;
        access_log off;
    }

    # Proxy API to backend. /api/v1/uploads/ is handled above when the volume is mounted; if not,
    # requests fall through only if you add a fallback — with alias present, missing mount returns 404.
    # For local dev without the volume, comment out the block above so all /api/ goes to Spring.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger / OpenAPI — must reach Spring; SPA fallback would serve index.html for /swagger-ui/*
    location ^~ /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api-docs {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8080/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static assets with cache headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Homepage: exact match so we always emit canonical Link (directory index can bypass @spa otherwise).
    #
    # Serves the prerendered copy of the expo landing page when the build produced one
    # (vite/prerender.js), so the first response already contains the page's headings and
    # text instead of an empty <div id="app">. index.html is the fallback, so a build
    # without the plugin still serves the site — just without the head start.
    location = / {
        root /usr/share/nginx/html;
        # https, not $scheme: TLS terminates in front of nginx and this block listens on
        # :80, so $scheme is "http" here while every public URL is https. A canonical on
        # the wrong scheme contradicts the one the router sets in the page.
        add_header Link "<https://ethiobuildconnect.et/>; rel=canonical" always;
        # index.html must never be cached: it references content-hashed JS/CSS chunks, and a
        # stale copy points at chunk filenames that no longer exist after a redeploy (the route's
        # dynamic import() then 404s and the SPA can't navigate to it — seen on Safari). The hashed
        # assets themselves stay immutable; only this HTML shell revalidates every load.
        add_header Cache-Control "no-cache" always;
        try_files /prerender/home.html /index.html =404;
    }

    # Alias URLs: routes that render a page another URL owns.
    #
    # `/exhibition` renders the same expo view as `/`, and `/marketplace/real-estate` the
    # same search view as `/real-estate` — see `meta.canonicalPath` in src/router/index.js.
    # These need their own blocks because @spa's Link header names whichever path was
    # requested, which contradicted the canonical the page itself sets; offered two
    # different canonicals for one document, a crawler trusts neither. Exact matches, so
    # nginx cannot add a trailing slash or fall through to the directory index.
    location = /exhibition {
        root /usr/share/nginx/html;
        add_header Link "<https://ethiobuildconnect.et/>; rel=canonical" always;
        add_header Cache-Control "no-cache" always;
        try_files /prerender/exhibition.html /index.html =404;
    }

    location = /marketplace/real-estate {
        root /usr/share/nginx/html;
        add_header Link "<https://ethiobuildconnect.et/real-estate>; rel=canonical" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /ethiopia-real-estate-market {
        root /usr/share/nginx/html;
        add_header Link "<https://ethiobuildconnect.et/ethiopia-real-estate-market>; rel=canonical" always;
        add_header Cache-Control "no-cache" always;
        try_files /prerender/ethiopia-real-estate-market.html /index.html =404;
    }

    # A four-sentence page that restates what /real-estate says and links to it. It was
    # listed in sitemap.xml, so Google was being asked to spend crawl budget on thin
    # duplicate content; 301 rather than delete, so whatever the URL has earned moves to
    # the page that actually answers the query. The file stays in the image, which makes
    # this one line to revert.
    location = /ethio-real-estate-marketplace.html {
        return 301 https://ethiobuildconnect.et/real-estate;
    }

    # Bot detection for Social Media sharing (OpenGraph)
    set $is_bot 0;
    if ($http_user_agent ~* "facebookexternalhit|twitterbot|whatsapp|telegrambot|skypeuripreview|linkedinbot|discordbot|viber") {
        set $is_bot 1;
    }

    # Intercept social crawlers dynamically
    location ~* ^/(properties|buildings|organizations)/([a-zA-Z0-9-]+)$ {
        if ($is_bot = 1) {
            rewrite ^ /seo-proxy$uri break;
            proxy_pass http://backend:8080;
        }
        try_files $uri $uri/ @spa;
    }

    # SPA fallback: serve index.html when no file exists. Emit Link rel=canonical so crawlers see the
    # correct URL before JavaScript runs (same URL as Vue router + meta; Google supports HTTP Link canonical).
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        root /usr/share/nginx/html;
        # Capture the requested path BEFORE try_files rewrites $uri to /index.html.
        # add_header is evaluated by the header filter, long after try_files has run, so
        # reading $uri there yielded "/index.html" for every route — the whole site
        # advertised the homepage as its canonical and Google folded it into one page.
        # `set` runs in the rewrite phase, try_files in precontent, so this sees the
        # original path.
        set $canonical_path $uri;
        # https for the same reason as `location = /` above.
        add_header Link "<https://ethiobuildconnect.et$canonical_path>; rel=canonical" always;
        # Never cache the SPA shell (see the note on `location = /`). Deep links like /live are
        # served here, so a stale shell is exactly what broke direct navigation to them.
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # NOTE: http -> https is deliberately NOT redirected here. TLS terminates in front
    # of nginx, so every request arrives on :80 and $scheme is always "http" —
    # redirecting on it would loop. Keying off $http_x_forwarded_proto looks safe but
    # is not universally: a terminator in a flexible/half-TLS mode reports
    # "http" even for an https visitor, which turns the rule into an infinite
    # redirect. Enable it at the terminator instead, or here only after confirming
    # the terminator forwards the visitor's real protocol.

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
